[package]
name = "network-diagnostics"
version = "0.3.1"
edition = "2021"
license = "MIT"
description = "Network Diagnostics — native proxy checker + domain health (Tauri shell over nd-core)."

[lib]
# Mobile builds require a library target (staticlib/cdylib for the
# Android/iOS loaders, rlib for the desktop binary shim).
name = "network_diagnostics_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "network-diagnostics"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
nd-core = { path = "../../core" }

[profile.release]
opt-level = 3
lto = true

# The app is its own workspace root: without this, cargo sees the parent
# workspace at the repository root and refuses to build
# ("current package believes it's in a workspace when it's not").
[workspace]
