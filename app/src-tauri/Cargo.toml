[package]
name = "network-diagnostics"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Network Diagnostics — native proxy checker + domain health (Tauri shell over nd-core)."

[[bin]]
name = "network-diagnostics"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
nd-core = { path = "../../core" }

[profile.release]
opt-level = 3
lto = true
